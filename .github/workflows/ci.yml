name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # serve: mypy checks the API, and without fastapi's real types every route
        # decorator reads as untyped and --strict rejects the file. otel: the
        # tracing tests assert against real SDK spans, and skip without it.
        run: pip install -e ".[dev,serve,otel]"
      - name: Lint
        run: ruff check src tests workflows
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest --cov=flowforge

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
