name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # serve too: mypy checks the API, and without fastapi's real types every
        # route decorator reads as untyped and --strict rejects the file.
        run: pip install -e ".[dev,serve]"
      - name: Lint
        run: ruff check src tests workflows
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest --cov=flowforge
