[project]
name = "flowforge"
version = "0.1.0"
description = "Durable workflow engine for AI-driven business automation. Event-sourced execution, typed LLM steps, human-in-the-loop, compensating actions, per-tenant cost budgets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "flowforge" }]
keywords = [
    "workflow-engine",
    "ai-automation",
    "llm",
    "durable-execution",
    "event-sourcing",
    "saga-pattern",
    "human-in-the-loop",
]
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Enabled as the corresponding subsystems land (see README roadmap).
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
]
llm = [
    "instructor>=1.6",
    "openai>=1.55",
]
otel = [
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[project.scripts]
flowforge = "flowforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "workflows"]

[[tool.mypy.overrides]]
module = ["redis.*", "asyncpg.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "workflows"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["flowforge", "workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["flowforge"]
branch = true
